name: Verify U Ilem 4.0
on:
  push:
    branches:
      - fix/audit-2026-11-03
    paths:
      - .github/workflows/audit-uilem4-base.yml
      - U_Ilem_4_0/U_Ilem_4_0_*.js
      - U_Ilem_4_0/U_Ilem_4_0_base.html
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-2026-11-03
          fetch-depth: 1
      - name: JavaScript syntax
        run: |
          cd U_Ilem_4_0
          for file in U_Ilem_4_0_*.js; do node --check "$file"; done
      - name: Existing integration tests
        run: |
          cd U_Ilem_4_0
          node U_Ilem_4_0_production.test.js
          node U_Ilem_4_0_calendar_tasks.test.js
          node U_Ilem_4_0_map_ui.test.js
          node U_Ilem_4_0_ollama.test.js
          node U_Ilem_4_0_water.test.js
          node U_Ilem_4_0_ecology.test.js
          node U_Ilem_4_0_construction.test.js
          node U_Ilem_4_0_server.test.js
